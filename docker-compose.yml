services:
  web:
    build:
      context: .
      target: runtime
    image: kurio:local
    ports:
      - '8080:80'
    restart: unless-stopped

  # desenvolvimento com HMR: docker compose --profile dev up
  dev:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '5174:5174'

volumes:
  node_modules:
