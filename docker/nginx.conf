server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # assets com hash no nome podem ser cacheados para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # o service worker do MSW nunca pode ser cacheado: é ele que decide
    # quais requests são interceptados
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-store";
    }

    # SPA: qualquer rota desconhecida devolve o index e o router resolve
    location / {
        try_files $uri $uri/ /index.html;
    }
}
